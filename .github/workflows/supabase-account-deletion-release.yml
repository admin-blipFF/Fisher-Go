name: Supabase account deletion release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: fishergo-account-deletion-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify deletion source contracts
        run: >-
          flutter test --no-pub --reporter compact
          test/delete_account_source_test.dart
          test/supabase_account_deletion_workflow_source_test.dart

      - name: Deploy protected delete-account function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          npx --yes supabase functions deploy delete-account \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Run disposable account deletion smoke
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FISHERGO_SMOKE_DELETION_EMAIL: ${{ secrets.FISHERGO_SMOKE_DELETION_EMAIL }}
          FISHERGO_SMOKE_DELETION_PASSWORD: ${{ secrets.FISHERGO_SMOKE_DELETION_PASSWORD }}
        run: dart run tool/verify_supabase_account_deletion.dart
