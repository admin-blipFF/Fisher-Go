name: Supabase content release

on:
  workflow_dispatch:
    inputs:
      reconcile_legacy_history:
        description: >-
          Owner-approved one-time repair of remote migration history rows 001/002
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fishergo-content-release
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: fishergo-content-release
    outputs:
      project_ref: ${{ steps.release-target.outputs.project_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify protected release inputs before mutation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_LEGACY_HISTORY_REPAIR_CONFIRMATION: ${{ secrets.SUPABASE_LEGACY_HISTORY_REPAIR_CONFIRMATION }}
          FISHERGO_RLS_USER_A_EMAIL: ${{ secrets.FISHERGO_RLS_USER_A_EMAIL }}
          FISHERGO_RLS_USER_A_PASSWORD: ${{ secrets.FISHERGO_RLS_USER_A_PASSWORD }}
          FISHERGO_RLS_USER_B_EMAIL: ${{ secrets.FISHERGO_RLS_USER_B_EMAIL }}
          FISHERGO_RLS_USER_B_PASSWORD: ${{ secrets.FISHERGO_RLS_USER_B_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$FISHERGO_RLS_USER_A_EMAIL"
          test -n "$FISHERGO_RLS_USER_A_PASSWORD"
          test -n "$FISHERGO_RLS_USER_B_EMAIL"
          test -n "$FISHERGO_RLS_USER_B_PASSWORD"
          if [ "${{ inputs.reconcile_legacy_history }}" = "true" ]; then
            test "$SUPABASE_LEGACY_HISTORY_REPAIR_CONFIRMATION" = "FISHERGO_REPAIR_001_002"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify content release source contracts
        run: >-
          flutter test --no-pub --reporter compact
          test/admin_spot_moderation_source_test.dart
          test/admin_spot_content_source_test.dart
          test/real_catch_moderation_source_test.dart
          test/analytics_ingestion_source_test.dart
          test/supabase_analytics_ingestion_source_test.dart
          test/analytics_retention_source_test.dart
          test/server_event_config_source_test.dart
          test/security/supabase_ci_source_test.dart
          test/remote_event_species_identity_source_test.dart
          test/real_catch_leaderboard_source_test.dart
          test/server_gameplay_session_source_test.dart
          test/location_integrity_source_test.dart
          test/supabase_legacy_rls_smoke_source_test.dart
          test/supabase_content_release_workflow_source_test.dart

      - name: Link and apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_LEGACY_HISTORY_REPAIR_CONFIRMATION: ${{ secrets.SUPABASE_LEGACY_HISTORY_REPAIR_CONFIRMATION }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$SUPABASE_DB_PASSWORD"
          dart run tool/verify_supabase_project_identity.dart
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          echo "Linked migration history before optional reconciliation:"
          history_before_file="$RUNNER_TEMP/fishergo-migration-history-before.txt"
          supabase migration list --linked | tee "$history_before_file"
          if [ "${{ inputs.reconcile_legacy_history }}" = "true" ]; then
            test "$SUPABASE_LEGACY_HISTORY_REPAIR_CONFIRMATION" = "FISHERGO_REPAIR_001_002"
            echo "Applying owner-approved migration history repair for 001/002"
            supabase migration repair 001 002 --linked --status reverted --yes
          fi
          # These are compatibility markers for retired three-digit history rows.
          # Keep them in Git for audit context, but never re-apply them after repair.
          rm -f supabase/migrations/001_player_cloud_sync.sql
          rm -f supabase/migrations/002_grant_linked_test_runner_access.sql
          test ! -e supabase/migrations/001_player_cloud_sync.sql
          test ! -e supabase/migrations/002_grant_linked_test_runner_access.sql
          echo "Planned linked migration changes:"
          plan_file="$RUNNER_TEMP/fishergo-migration-plan.txt"
          supabase db push --linked --include-all --dry-run 2>&1 | tee "$plan_file"
          allowed_ids="$(
            find supabase/migrations -maxdepth 1 -type f \
              -name '[0-9][0-9][0-9][0-9]_*.sql' \
              | sed -E 's#^.*/([0-9]{4})_.*#\1#' \
              | awk '$0 >= "0012"' \
              | sort -u \
              | paste -sd, -
          )"
          test -n "$allowed_ids"
          dart run tool/verify_supabase_migration_plan.dart \
            --plan-file="$plan_file" \
            --allowed="$allowed_ids"
          supabase db push --linked --include-all --yes
          history_after_file="$RUNNER_TEMP/fishergo-migration-history-after.txt"
          supabase migration list --linked | tee "$history_after_file"

      - name: Upload Supabase migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fishergo-supabase-migration-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fishergo-migration-history-before.txt
            ${{ runner.temp }}/fishergo-migration-plan.txt
            ${{ runner.temp }}/fishergo-migration-history-after.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Export linked project ref
        id: release-target
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF"
          echo "project_ref=$SUPABASE_PROJECT_REF" >> "$GITHUB_OUTPUT"

      - name: Verify linked database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase test db --linked supabase/tests/remote_player_rls_shape_test.sql \
            supabase/tests/remote_player_rls_behavior_test.sql \
            supabase/tests/analytics_events_shape_test.sql \
            supabase/tests/analytics_retention_shape_test.sql \
            supabase/tests/catch_photo_bucket_shape_test.sql \
            supabase/tests/fishing_spot_content_shape_test.sql \
            supabase/tests/fishing_spot_moderation_shape_test.sql \
            supabase/tests/gameplay_reward_ticket_shape_test.sql \
            supabase/tests/gameplay_session_shape_test.sql \
            supabase/tests/real_catch_moderation_shape_test.sql \
            supabase/tests/server_authoritative_rewards_shape_test.sql \
            supabase/tests/server_event_config_shape_test.sql \
            supabase/tests/notification_device_tokens_shape_test.sql \
            supabase/tests/notification_device_tokens_behavior_test.sql
          supabase db lint --linked --schema public --fail-on error

      - name: Prepare legacy Auth-backed RLS fixture
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FISHERGO_RLS_USER_A_EMAIL: ${{ secrets.FISHERGO_RLS_USER_A_EMAIL }}
          FISHERGO_RLS_USER_A_PASSWORD: ${{ secrets.FISHERGO_RLS_USER_A_PASSWORD }}
          FISHERGO_RLS_USER_B_EMAIL: ${{ secrets.FISHERGO_RLS_USER_B_EMAIL }}
          FISHERGO_RLS_USER_B_PASSWORD: ${{ secrets.FISHERGO_RLS_USER_B_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/prepare_supabase_legacy_rls_test.dart \
            --output=tmp/legacy_auth_rls_test.sql

      - name: Verify legacy Auth-backed RLS behavior
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase test db --linked tmp/legacy_auth_rls_test.sql

  hosted-gameplay-smoke:
    needs: apply-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: fishergo-live-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify protected live smoke inputs before setup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$SUPABASE_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" = "${{ needs.apply-and-verify.outputs.project_ref }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Supabase project identity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$SUPABASE_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" = "${{ needs.apply-and-verify.outputs.project_ref }}"
          dart run tool/verify_supabase_project_identity.dart

      - name: Verify hosted fishing-spot habitat weights
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_EXPECTED_PROJECT_REF: ${{ needs.apply-and-verify.outputs.project_ref }}
        run: dart run tool/verify_supabase_fishing_spot_habitat.dart

      - name: Verify hosted analytics ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_EXPECTED_PROJECT_REF: ${{ needs.apply-and-verify.outputs.project_ref }}
        run: dart run tool/verify_supabase_analytics_ingestion.dart

      - name: Verify hosted server event configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_EXPECTED_PROJECT_REF: ${{ needs.apply-and-verify.outputs.project_ref }}
        run: dart run tool/verify_supabase_event_config.dart

      - name: Verify hosted gameplay session
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_EXPECTED_PROJECT_REF: ${{ needs.apply-and-verify.outputs.project_ref }}
          FISHERGO_SMOKE_GAMEPLAY_SPOT_ID: ${{ secrets.FISHERGO_SMOKE_GAMEPLAY_SPOT_ID }}
        run: dart run tool/verify_supabase_gameplay_session.dart
