name: fishergo
description: Hong Kong fishing companion MVP.
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase: ^2.10.6
  supabase_flutter: ^2.12.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  google_generative_ai: ^0.2.2
  http: ^1.2.2
  flutter_map: ^7.0.2
  maplibre: ^0.3.5
  pointer_interceptor: ^0.10.1+2
  latlong2: ^0.9.1
  uuid: ^4.5.1
  go_router: ^17.2.3
  flutter_svg: ^2.2.0
  web: ^1.1.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  xml: ^7.0.1
  image: ^4.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/fish/icons/locked_silhouette.png
    - assets/fish/mobile_webp/
    - assets/fish/icons/silhouettes/
    - assets/avatar/layers/
    - assets/maps/
    - assets/maps/textures/
    - assets/fishing/
    - assets/fishing/map_markers/
    - assets/fishing/scenes/
    - assets/minigame/
